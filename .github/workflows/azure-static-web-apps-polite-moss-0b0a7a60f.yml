name: Redirect old SWA to new

on:
  push:
    branches:
      - main

jobs:
  deploy_redirect:
    runs-on: ubuntu-latest
    name: Deploy redirect
    steps:
      - uses: actions/checkout@v3
      - name: Deploy redirect config
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_MOSS_0B0A7A60F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "redirect-app"
          api_location: ""
          output_location: ""
