name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.backend'
      - 'shared/**'

env:
  REGISTRY: persengineacr.azurecr.io
  IMAGE: pers-engine-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PERSENGINEBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PERSENGINEBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PERSENGINEBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name pers-engine-backend \
            --resource-group pers-engine-rg \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
